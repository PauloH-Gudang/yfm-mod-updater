# Compila todos os mods da pasta mods/ e publica o site (index.html) no GitHub Pages.
name: build-mods
on:
  push:
    branches-ignore: ["build/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Compilador (llvm-mingw 20260922) e SDK do release mais recente do jogo
        run: |
          tag=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/Unchiga/Yu-Gi-Oh-Forbidden-Memories-Recompiled/releases?per_page=1" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['tag_name'])")
          echo "Jogo: $tag"
          curl -sSL -o /tmp/lm.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p /tmp/lm && tar -xJf /tmp/lm.tar.xz -C /tmp/lm --strip-components=1
          curl -sSL -o /tmp/game.tgz "https://github.com/Unchiga/Yu-Gi-Oh-Forbidden-Memories-Recompiled/releases/download/$tag/yfm-redecomp-$tag-linux.tar.gz"
          mkdir -p /tmp/game && tar -xzf /tmp/game.tgz -C /tmp/game --strip-components=1
          mv /tmp/game/sdk /tmp/sdk
          echo "/tmp/lm/bin" >> "$GITHUB_PATH"

      - name: Compilar os mods
        run: |
          mkdir -p out
          found=0
          for dir in mods/*/; do
            [ -f "$dir/mod.json" ] || continue
            found=1
            name=$(basename "$dir")
            if ls "$dir"*.c >/dev/null 2>&1; then
              echo "::group::$name"
              python3 /tmp/sdk/tools/build_mod.py "$dir"
              echo "::endgroup::"
            else
              echo "$name: só dados, nada a compilar"
            fi
            (cd mods && zip -qr "../out/$name.zip" "$name")
          done
          [ "$found" = 1 ] || echo "Nenhum mod em mods/. Coloque a pasta do mod lá (com o mod.json)."

      - uses: actions/upload-artifact@v4
        with:
          name: mods-compilados
          path: out/
          if-no-files-found: ignore

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
